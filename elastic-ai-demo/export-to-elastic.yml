default:
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
      value: ""
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,$(OTEL_RESOURCE_ATTRIBUTES_EXTRA)
opentelemetry-collector:
  presets:
    logsCollection:
      enabled: true
      storeCheckpoints: false
    hostMetrics:
      enabled: true
    kubeletMetrics:
      enabled: true
    clusterMetrics:
      enabled: true
  extraEnvs:
    - name: ELASTIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: elastic-secret-otel
          key: elastic_api_key
  config:
    exporters:
      otlp/elastic:
        endpoint: https://d90c8440691b40f885c64c111c92f0eb.ingest.europe-west3.gcp.elastic.cloud:443
        headers:
          Authorization: ApiKey ${env:ELASTIC_API_KEY}
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 50000000 # 50MB uncompressed
          block_on_overflow: true
          batch:
            flush_timeout: 1s
            min_size: 1_000_000 # 1MB uncompressed
            max_size: 4_000_000 # 4MB uncompressed
        timeout: 15s
    processors:
      # [K8s Attributes Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor)
      k8sattributes:
        passthrough: false # Annotates resources with the pod IP and does not try to extract any other metadata.
        pod_association:
          # Below association takes a look at the k8s.pod.ip and k8s.pod.uid resource attributes or connection's context, and tries to match it with the pod having the same attribute.
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
        extract:
          metadata:
            - "k8s.namespace.name"
            - "k8s.deployment.name"
            - "k8s.replicaset.name"
            - "k8s.statefulset.name"
            - "k8s.daemonset.name"
            - "k8s.cronjob.name"
            - "k8s.job.name"
            - "k8s.node.name"
            - "k8s.pod.name"
            - "k8s.pod.ip"
            - "k8s.pod.uid"
            - "k8s.pod.start_time"
            # Service attributes added based on https://opentelemetry.io/docs/specs/semconv/non-normative/k8s-attributes/#service-attributes
            - "service.name"
            - "service.version"
            - "service.instance.id"
      # [Resource Detection Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourcedetectionprocessor)
      resourcedetection/eks:
        # Detects resources from environment variables and EKS (Elastic Kubernetes Service).
        detectors: [env, eks]
        timeout: 15s
        override: true
        eks:
          resource_attributes:
            k8s.cluster.name:
              enabled: true
      resourcedetection/gcp:
        # Detects resources from environment variables and GCP (Google Cloud Platform).
        detectors: [env, gcp]
        timeout: 2s
        override: true
      resourcedetection/aks:
        # Detects resources from environment variables and AKS (Azure Kubernetes Service).
        detectors: [env, aks]
        timeout: 2s
        override: true
        aks:
          resource_attributes:
            k8s.cluster.name:
              enabled: true
      resource/hostname:
        attributes:
          - key: host.name
            from_attribute: k8s.node.name
            action: upsert
      transform/span_name_from_url:
        trace_statements:
          - context: span
            conditions:
              - attributes["http.url"] != nil and attributes["http.method"] != nil and resource.attributes["service.name"] == "frontend-proxy"
              - attributes["http.url"] != nil and attributes["http.method"] != nil and resource.attributes["service.name"] == "frontend"
            statements:
              - set(cache["tmp"], URL(attributes["http.url"]))
              - replace_pattern(cache["tmp"]["url.path"], "^((/[^/]+){1,2}).*$", "$1")
              - set(name, cache["tmp"]["url.path"])
              - set(name, Concat([attributes["http.method"],cache["tmp"]["url.path"]], " "))
      filter/flagd:
        traces:
          span:
            - 'name == "/flagd.evaluation.v1.Service/EventStream"'

    service:
      pipelines:
        traces:
          processors:
            - filter/flagd
            - transform/span_name_from_url
            - k8sattributes
            - resourcedetection/eks
            - resourcedetection/gcp
            - resourcedetection/aks
            - resource/hostname
          exporters:
            - spanmetrics
            - otlp/elastic
        logs:
          processors:
            - k8sattributes
            - resourcedetection/eks
            - resourcedetection/gcp
            - resourcedetection/aks
            - resource/hostname
          exporters:
            - otlp/elastic
        metrics:
          processors:
            - k8sattributes
            - resourcedetection/eks
            - resourcedetection/gcp
            - resourcedetection/aks
            - resource/hostname
          exporters:
            - otlp/elastic

components:
  recommendation:
    imageOverride:
      repository: ghcr.io/alexanderwert/demo
      tag: "latest-recommendation"
      pullPolicy: Always
  accounting:
    resources:
      limits:
        memory: 150Mi

opensearch:
  enabled: false

grafana:
  enabled: false

jaeger:
  enabled: false

prometheus:
  enabled: false